# Alembic configuration (SPEC §6, D-50).
#
# The database URL is never written here: migrations/env.py reads DATABASE_URL through
# cicd_doctor.app.settings (so `.env` works), unless a caller passes one in
# config.attributes["database_url"] (the tests do).
#
#   uv run alembic upgrade head
#   uv run alembic downgrade base

[alembic]
script_location = %(here)s/src/cicd_doctor/adapters/postgres/migrations
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
