name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    name: Types (mypy --strict)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run mypy

  tests:
    name: Tests (pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Same image as docker/compose.yaml (SPEC §12). Integration tests fail here instead of being
    # skipped, because GitHub Actions sets CI=true (D-51).
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: cicd
          POSTGRES_PASSWORD: cicd
          POSTGRES_DB: cicd_doctor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cicd -d cicd_doctor"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://cicd:cicd@127.0.0.1:5432/cicd_doctor
      TEST_DATABASE_URL: postgresql+psycopg://cicd:cicd@127.0.0.1:5432/cicd_doctor_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      # The embedding model (66 MB). A cold download took up to 166 s, so it is cached; the key
      # carries the model and the SHA-256 of its .onnx file (the same value as
      # tests/adapters/test_fastembed.py, D-78).
      - name: Cache the embedding model
        id: model-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/fastembed
          key: fastembed-bge-small-en-v1.5-onnx-Q-51f1bd0addd6e859e42c2c8021a5e5461385bb676a649f4b269aa445449f2431
      # On a cache miss (the first run, or a new key) download it here, once, so the tests
      # below never do: test_fastembed.py fails in CI if the model is not in the cache.
      - name: Download the embedding model (cache miss only)
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: >-
          uv run python -c "from pathlib import Path;
          from cicd_doctor.adapters.embeddings.fastembed_embedder import FastEmbedEmbedder;
          raise SystemExit(0 if FastEmbedEmbedder(Path('.cache/fastembed')).warm() else 1)"
      # The migration through the real CLI, on an empty database (SPEC §13 P1a).
      - run: uv run alembic upgrade head
      # The whole suite, plus the core/ coverage gate of NFR-09 (>= 90%, P1b).
      - run: uv run pytest --cov=cicd_doctor.core --cov-report=term-missing:skip-covered --cov-fail-under=90
