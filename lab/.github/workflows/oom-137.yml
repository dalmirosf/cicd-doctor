# infra_or_deploy: a process exceeds its memory limit and is killed (exit code 137).
# Fails on purpose. Started by hand only (workflow_dispatch); see README.md.
name: oom-137

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: >
          docker run --rm --memory=64m --memory-swap=64m python:3.13-slim
          python -c "data = b'x' * (512 * 1024 * 1024)"
