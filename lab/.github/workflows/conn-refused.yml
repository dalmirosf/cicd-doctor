# network: nothing listens on the port the step connects to.
# Fails on purpose. Started by hand only (workflow_dispatch); see README.md.
name: conn-refused

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -c "import socket; socket.create_connection(('127.0.0.1', 9), timeout=5)"
