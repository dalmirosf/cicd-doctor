# config_or_secrets: the secret name is misspelled, so the token is empty.
# Fails on purpose. Started by hand only (workflow_dispatch); see README.md.
name: secret-misspelled

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy with the deploy token
        env:
          TOKEN: ${{ secrets.LAB_DEPLOY_TOKNE }}  # misspelled on purpose
        run: |
          : "${TOKEN:?Error: the deploy token is empty or not set}"
          echo deploying
