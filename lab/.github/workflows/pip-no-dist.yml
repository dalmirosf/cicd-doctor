# dependency: a package that does not exist on PyPI.
# Fails on purpose. Started by hand only (workflow_dispatch); see README.md.
name: pip-no-dist

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          python3 -m venv .venv
          .venv/bin/pip install cicd-doctor-lab-does-not-exist==9.9.9
