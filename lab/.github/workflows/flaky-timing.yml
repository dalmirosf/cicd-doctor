# flaky: a test with a tight timing assertion. Run it until it fails.
# Fails on purpose. Started by hand only (workflow_dispatch); see README.md.
name: flaky-timing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run pytest tests/test_flaky_timing.py
