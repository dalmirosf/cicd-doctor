# dependency: the code imports requests, which pyproject.toml does not declare.
# The same failure as py-modnf.yml, but started by a pull request, to check CICD Doctor against real
# pull requests (P1c, "Live verification" in README.md). Fails on purpose.
name: pr-py-modnf

on:
  pull_request:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run python -m labpkg.cli
