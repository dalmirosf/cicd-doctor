# timeout: a step's timeout-minutes is shorter than the work.
# Fails on purpose. Started by hand only (workflow_dispatch); see README.md.
name: step-timeout

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sleep for five minutes
        run: sleep 300
        timeout-minutes: 1
